<html lang="zh-CN">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>命中注定属于你的城市</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">

<style>
:root{
  --bg:#14102a;
  --bg2:#241a44;
  --gold:#e6c58c;
  --ink:#f2ece2;
  --sub:#b6accb;
  --line:rgba(255,255,255,.12);
  --card:rgba(255,255,255,.055);
  --serif:"Noto Serif SC",serif;
  --sans:"Noto Sans SC",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:var(--sans);
  color:var(--ink);
  background-color:#14102a;
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
.bg-layer{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(1200px 700px at 78% -10%,#3a2a63 0%,transparent 55%),
    radial-gradient(900px 600px at 10% 110%,#2a2150 0%,transparent 55%),
    linear-gradient(160deg,var(--bg) 0%,#1b1436 55%,#100c22 100%);}
/* 星空背景 */
.stars,.stars::after,.stars::before{position:fixed;inset:0;pointer-events:none;z-index:0}
.star{position:absolute;background:#fff;border-radius:50%;opacity:.55;animation:twinkle 4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.85}}
.glow{position:fixed;border-radius:50%;filter:blur(70px);pointer-events:none;z-index:0}
.glow.a{width:340px;height:340px;top:-90px;right:-80px;background:rgba(230,197,140,.16)}
.glow.b{width:300px;height:300px;bottom:-100px;left:-70px;background:rgba(130,110,200,.2)}

.wrap{position:relative;z-index:2;max-width:560px;margin:0 auto;padding:38px 22px 56px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.view{display:none;animation:fade .7s ease both}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* 开场 */
.hero{text-align:center}
.hero .kicker{font-size:12px;letter-spacing:.42em;color:var(--gold);text-indent:.42em;margin-bottom:26px;font-weight:300}
.hero h1{font-family:var(--serif);font-weight:900;font-size:clamp(34px,9vw,52px);line-height:1.28;letter-spacing:.02em}
.hero h1 em{font-style:normal;color:var(--gold);position:relative}
.hero .sub{margin:22px auto 0;max-width:380px;color:var(--sub);font-size:15px;line-height:1.9;font-weight:300}
.skyline{margin:34px auto 6px;width:100%;max-width:420px;opacity:.9}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  font-family:var(--sans);font-size:16px;font-weight:500;letter-spacing:.08em;
  color:#231a3a;background:linear-gradient(135deg,#f0d9ac,#d9b578);
  border:none;border-radius:999px;padding:16px 46px;cursor:pointer;margin-top:36px;
  box-shadow:0 10px 30px rgba(214,178,116,.28);transition:transform .25s,box-shadow .25s;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 16px 38px rgba(214,178,116,.38)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none;margin-top:18px;padding:14px 40px}
.hero .meta{margin-top:26px;font-size:12px;color:var(--sub);letter-spacing:.18em;font-weight:300}

/* 答题 */
.quiz-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.q-count{font-family:var(--serif);font-size:15px;color:var(--gold);letter-spacing:.1em}
.q-count b{font-size:22px;font-weight:700}
.q-dim{font-size:12px;color:var(--sub);letter-spacing:.2em;border:1px solid var(--line);padding:6px 14px;border-radius:999px}
.progress{height:3px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden;margin-bottom:40px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#f0d9ac,#d9b578);border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.q-title{font-family:var(--serif);font-weight:700;font-size:clamp(21px,5.4vw,26px);line-height:1.6;margin-bottom:32px;min-height:64px}
.opts{display:flex;flex-direction:column;gap:14px}
.opt{
  text-align:left;font-family:var(--sans);font-size:15.5px;line-height:1.6;color:var(--ink);
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:18px 20px;cursor:pointer;backdrop-filter:blur(8px);
  transition:border-color .2s,background .2s,transform .2s;
}
.opt:hover{border-color:rgba(230,197,140,.55);background:rgba(230,197,140,.1);transform:translateX(4px)}
.opt .idx{display:inline-block;width:24px;height:24px;line-height:24px;text-align:center;border-radius:50%;
  border:1px solid var(--line);font-size:12px;color:var(--gold);margin-right:12px;vertical-align:middle}
.opt.picked{border-color:var(--gold);background:rgba(230,197,140,.16)}
.q-back{margin-top:28px;background:none;border:none;color:var(--sub);font-size:13px;cursor:pointer;letter-spacing:.1em;font-family:var(--sans)}
.q-back:hover{color:var(--gold)}

/* 结果 */
.result{text-align:center}
.result .r-kicker{font-size:12px;letter-spacing:.4em;color:var(--gold);text-indent:.4em;margin-bottom:18px}
.r-badge{display:inline-block;font-family:var(--serif);font-size:13px;letter-spacing:.24em;padding:7px 20px;border:1px solid var(--gold);border-radius:999px;color:var(--gold);margin-bottom:26px}
.r-city{font-family:var(--serif);font-weight:900;font-size:clamp(40px,11vw,62px);line-height:1.15;letter-spacing:.04em}
.r-name{font-family:var(--serif);font-size:clamp(18px,4.6vw,22px);color:var(--gold);margin-top:10px;letter-spacing:.12em}
.r-land{width:100%;max-width:440px;margin:26px auto 0;border:1px solid var(--line);border-radius:22px;overflow:hidden;background:rgba(255,255,255,.045);backdrop-filter:blur(6px)}
.r-land svg{display:block;width:100%;height:auto}
.r-land .cap{font-size:11.5px;letter-spacing:.24em;color:var(--sub);text-align:center;padding:11px 0 12px;border-top:1px solid var(--line)}
.r-fate{font-family:var(--serif);font-size:clamp(17px,4.4vw,20px);line-height:1.9;color:var(--ink);margin:28px auto 0;max-width:420px;font-weight:600}
.r-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 24px;margin-top:28px;text-align:left;backdrop-filter:blur(10px)}
.r-card h4{font-family:var(--serif);font-size:14px;color:var(--gold);letter-spacing:.2em;margin-bottom:14px;font-weight:600}
.r-card p{font-size:14.5px;line-height:1.95;color:var(--sub);font-weight:300}
.tags{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.tags span{font-size:13px;letter-spacing:.08em;padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--ink)}
.r-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.r-mini{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px;text-align:left}
.r-mini h5{font-size:12px;color:var(--gold);letter-spacing:.16em;margin-bottom:8px;font-weight:500}
.r-mini p{font-size:13.5px;line-height:1.7;color:var(--sub);font-weight:300}
.r-actions{display:flex;flex-direction:column;align-items:center;margin-top:34px}
.share-tip{margin-top:20px;font-size:12px;color:var(--sub);letter-spacing:.12em;font-weight:300}
@media (max-width:380px){.r-grid{grid-template-columns:1fr}}
</style>
</head>

    <div class="result" id="result-box"></div>
  </section>
</div>

var state={idx:0,answers:[]};
var $=function(id){return document.getElementById(id)};
function showView(id){
  var vs=document.querySelectorAll('.view');
  for(var i=0;i<vs.length;i++)vs[i].classList.remove('active');
  $(id).classList.add('active');
  window.scrollTo(0,0);
}
function renderQuestion(){
  var q=QUESTIONS[state.idx];
  $('q-now').textContent=state.idx+1;
  $('q-dim').textContent=q.dim;
  $('q-title').textContent=q.title;
  $('bar').style.width=((state.idx+1)/QUESTIONS.length*100)+'%';
  var letters=['A','B','C','D'],html='';
  for(var i=0;i<q.opts.length;i++){
    html+='<button class="opt" data-i="'+i+'"><span class="idx">'+letters[i]+'</span>'+q.opts[i].t+'</button>';
  }
  $('opts').innerHTML=html;
  var btns=$('opts').querySelectorAll('.opt');
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener('click',pickOption);
  }
}
function pickOption(e){

  btn.classList.add('picked');
  var i=parseInt(btn.getAttribute('data-i'),10);
  state.answers[state.idx]=i;
  setTimeout(function(){
    if(state.idx<QUESTIONS.length-1){
      state.idx++;renderQuestion();
    }else{
      showResult();
    }
  },320);
}
function calcResult(){
  var score={},main={};
  Object.keys(CITIES).forEach(function(k){score[k]=0;main[k]=0});
  state.answers.forEach(function(oi,qi){
    var s=QUESTIONS[qi].opts[oi].s;
    Object.keys(s).forEach(function(k){
      score[k]+=s[k];
      if(s[k]===2)main[k]++;
    });
  });
  var keys=Object.keys(score),best=keys[0];
  keys.forEach(function(k){
    if(score[k]>score[best]||(score[k]===score[best]&&main[k]>main[best]))best=k;
  });
  return best;
}
function showResult(){
  var key=calcResult(),c=CITIES[key];
  var tagsHtml='';
  c.tags.forEach(function(t){tagsHtml+='<span>'+t+'</span>'});
  $('result-box').innerHTML=
    '<div class="r-kicker">YOUR DESTINY CITY</div>'+
    '<div class="r-badge">'+c.badge+'</div>'+
    '<div class="r-city" style="background:linear-gradient(135deg,'+c.c1+','+c.c2+');-webkit-background-clip:text;background-clip:text;color:transparent">'+c.name+'</div>'+
    '<div class="r-name">'+c.persona+'</div>'+
    '<div class="r-land">'+c.land+'<div class="cap">'+c.name+' · 专属风景</div></div>'+
    '<p class="r-fate">“'+c.fate+'”</p>'+
    '<div class="r-card"><h4>灵魂解析</h4><p>'+c.desc+'</p></div>'+
    '<div class="r-card"><h4>你的关键词</h4><div class="tags">'+tagsHtml+'</div></div>'+
    '<div class="r-grid">'+
      '<div class="r-mini"><h5>同频城市</h5><p>'+c.match+'</p></div>'+
      '<div class="r-mini"><h5>需要避开</h5><p>'+c.avoid+'</p></div>'+
    '</div>'+
    '<div class="r-actions">'+
      '<button class="btn" id="btn-share">保存截图 · 分享</button>'+
      '<button class="btn ghost" id="btn-restart">重新测一次</button>'+
      '<div class="share-tip">长按或截图，把你的宿命城市分享出去</div>'+
    '</div>';
  showView('view-result');
  $('btn-restart').addEventListener('click',function(){
    state={idx:0,answers:[]};renderQuestion();showView('view-start');
  });
  $('btn-share').addEventListener('click',function(){
    var u=navigator.userAgent;
    if(/Mobi|Android|iPhone|iPad/i.test(u)){
      alert('请同时按下电源键和音量键截图，保存后即可分享到小红书、抖音');
    }else{
      window.print();
    }
  });
}
$('btn-start').addEventListener('click',function(){
  state={idx:0,answers:[]};renderQuestion();showView('view-quiz');
});
$('btn-back').addEventListener('click',function(){
  if(state.idx>0){state.idx--;renderQuestion();}
  else{showView('view-start');}
});
</script>
</body>
</html>
