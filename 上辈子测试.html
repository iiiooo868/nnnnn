<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>你上辈子是什么？</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23141b2e'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%23c9a86a'/%3E%3C/svg%3E">
<style>
  :root{
    --ink:#141b2e;
    --ink2:#1d2a44;
    --paper:#f5efe1;
    --paper2:#faf5e9;
    --gold:#c9a86a;
    --gold-light:#e3cd9c;
    --text:#ece3d0;
    --muted:#9aa3b8;
    --line:rgba(201,168,106,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
    color:var(--text);
    background:
      radial-gradient(1200px 600px at 80% -10%,rgba(201,168,106,.12),transparent 60%),
      radial-gradient(900px 500px at -10% 110%,rgba(80,110,160,.18),transparent 60%),
      linear-gradient(160deg,var(--ink),var(--ink2));
    min-height:100vh;
    line-height:1.7;
  }
  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    min-height:100dvh;
    padding:28px 22px 40px;
    display:flex;
    flex-direction:column;
  }
  .view{display:none;flex:1;flex-direction:column;animation:fade .45s ease;}
  .view.active{display:flex;}
  @keyframes fade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

  /* ===== 首页 ===== */
  #view-start{justify-content:center;align-items:center;text-align:center;gap:18px;}
  .moon{
    width:96px;height:96px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,var(--gold-light),var(--gold));
    box-shadow:0 0 50px rgba(201,168,106,.45);
    margin-bottom:6px;
  }
  #view-start h1{
    font-size:34px;letter-spacing:4px;color:var(--gold-light);
    font-weight:700;
  }
  #view-start .sub{color:var(--muted);font-size:15px;letter-spacing:1px;}
  .divider{width:56px;height:1px;background:var(--line);margin:6px auto;}
  .hint{font-size:13px;color:var(--muted);}

  .btn{
    font-family:inherit;cursor:pointer;border:none;
    min-height:52px;padding:0 38px;border-radius:30px;
    font-size:17px;letter-spacing:3px;
    background:linear-gradient(135deg,var(--gold-light),var(--gold));
    color:#2a2110;font-weight:700;
    box-shadow:0 8px 24px rgba(201,168,106,.3);
    transition:transform .15s ease;
  }
  .btn:active{transform:scale(.96);}

  /* ===== 答题页 ===== */
  .progress-meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);letter-spacing:1px;}
  .progress-bar{height:3px;background:rgba(255,255,255,.08);border-radius:3px;margin:12px 0 38px;overflow:hidden;}
  .progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold-light));transition:width .35s ease;}
  .question{
    font-size:23px;line-height:1.55;color:var(--text);
    font-weight:700;margin-bottom:34px;letter-spacing:1px;
  }
  .options{display:flex;flex-direction:column;gap:16px;}
  .opt{
    font-family:inherit;cursor:pointer;text-align:left;
    padding:20px 22px;border-radius:14px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.12);
    color:var(--text);font-size:16.5px;line-height:1.6;
    min-height:60px;transition:all .18s ease;
  }
  .opt:active{border-color:var(--gold);background:rgba(201,168,106,.12);transform:scale(.98);}
  .opt .tag{color:var(--gold);font-weight:700;margin-right:10px;}

  /* ===== 结果页 ===== */
  #view-result{align-items:center;justify-content:flex-start;}
  .result-card{
    width:100%;background:var(--paper2);color:#3a3326;
    border-radius:20px;padding:22px 20px 26px;
    box-shadow:0 18px 50px rgba(0,0,0,.45);
    display:flex;flex-direction:column;align-items:center;
  }
  .img-wrap{
    width:100%;border-radius:14px;overflow:hidden;
    background:#ddd;margin-bottom:20px;position:relative;
  }
  .img-wrap img{width:100%;display:none;aspect-ratio:9/16;object-fit:cover;}
  .img-wrap img.show{display:block;}
  .result-label{font-size:13px;color:#9a8c6c;letter-spacing:3px;}
  .result-name{font-size:28px;color:#7a5a24;letter-spacing:3px;margin:4px 0 12px;font-weight:700;}
  .result-desc{font-size:16px;color:#4d4434;line-height:1.8;text-align:center;padding:0 4px;margin-bottom:22px;}
  .result-actions{display:flex;flex-direction:column;gap:12px;width:100%;}
  .share-btn{
    display:none;width:100%;text-align:center;text-decoration:none;
    min-height:50px;line-height:50px;border-radius:26px;
    background:linear-gradient(135deg,var(--gold-light),var(--gold));
    color:#2a2110;font-weight:700;letter-spacing:2px;font-size:16px;
  }
  .share-btn.show{display:block;}
  .ghost-btn{
    font-family:inherit;cursor:pointer;width:100%;
    min-height:50px;border-radius:26px;
    background:transparent;border:1.5px solid #b89a5e;color:#7a5a24;
    font-size:16px;letter-spacing:2px;font-weight:700;
  }
  .ghost-btn:active{background:rgba(184,154,94,.15);}
  .save-tip{font-size:12.5px;color:#9a8c6c;margin-top:14px;text-align:center;}

  @media (min-width:768px){
    .app{max-width:520px;padding:48px 24px;}
    #view-start h1{font-size:40px;}
    .question{font-size:26px;}
  }
</style>
</head>
<body>
<div class="app">

  <!-- ===== 视图：首页 ===== -->
  <section id="view-start" class="view active">
    <div class="moon"></div>
    <h1>你上辈子是什么</h1>
    <div class="divider"></div>
    <p class="sub">8 道小题，穿越前世，看看你曾经是谁</p>
    <p class="hint">全程约 1 分钟 · 凭第一直觉作答</p>
    <button class="btn" style="margin-top:14px" onclick="startQuiz()">开始测试</button>
  </section>

  <!-- ===== 视图：答题 ===== -->
  <section id="view-quiz" class="view">
    <div class="progress-meta">
      <span id="step-text">第 1 / 8 题</span>
      <span>凭直觉选</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <h2 class="question" id="question-text"></h2>
    <div class="options" id="options-box"></div>
  </section>

  <!-- ===== 视图：结果 ===== -->
  <section id="view-result" class="view">
    <div class="result-card">
      <div class="img-wrap">
        <img id="img-yinshi" src="https://media.doubao.com/space/api/box/stream/download/all_by_mount_point/OOYcbTjQwoacEyxk2mxcdM6Pn8f" alt="山林隐士">
        <img id="img-xiake" src="https://media.doubao.com/space/api/box/stream/download/all_by_mount_point/PGK1bYgbzoYP7sx4Uf2cnyQ3nKf" alt="江湖侠客">
        <img id="img-wenren" src="https://media.doubao.com/space/api/box/stream/download/all_by_mount_point/NEUEbtlMIoKF3vxkIJ9cFW7jnFc" alt="书香文人">
        <img id="img-fugui" src="https://media.doubao.com/space/api/box/stream/download/all_by_mount_point/TQYrbpVxOoNxD3xzs2RcCDEynQB" alt="王侯富贵">
      </div>
      <div class="result-label">你的前世身份</div>
      <div class="result-name" id="result-name"></div>
      <p class="result-desc" id="result-desc"></p>
      <div class="result-actions">
        <a class="share-btn" id="share-yinshi" href="https://media.doubao.com/space/api/box/stream/download/all_by_mount_point/OOYcbTjQwoacEyxk2mxcdM6Pn8f" download="山林隐士.png">保存分享图</a>
        <a class="share-btn" id="share-xiake" href="https://media.doubao.com/space/api/box/stream/download/all_by_mount_point/PGK1bYgbzoYP7sx4Uf2cnyQ3nKf" download="江湖侠客.png">保存分享图</a>
        <a class="share-btn" id="share-wenren" href="https://media.doubao.com/space/api/box/stream/download/all_by_mount_point/NEUEbtlMIoKF3vxkIJ9cFW7jnFc" download="书香文人.png">保存分享图</a>
        <a class="share-btn" id="share-fugui" href="https://media.doubao.com/space/api/box/stream/download/all_by_mount_point/TQYrbpVxOoNxD3xzs2RcCDEynQB" download="王侯富贵.png">保存分享图</a>
        <button class="ghost-btn" onclick="restart()">再测一次</button>
      </div>
      <p class="save-tip">手机端如未自动下载，可长按上方图片保存到相册</p>
    </div>
  </section>

</div>

<script>
/* ===== 题库：dim 标记该选项计入的维度 =====
   维度一 seclusion(出世) / world(入世)
   维度二 move(动) / still(静) */
var QUESTIONS = [
  {q:"周末两天完全空着，你更想？", a:[
    {t:"一个人去山里住一晚，谁也别找我", dim:"seclusion"},
    {t:"约朋友进城逛街，凑个热闹", dim:"world"}]},
  {q:"平时走路，你更习惯？", a:[
    {t:"脚步轻快，东看西看，随时能跑起来", dim:"move"},
    {t:"慢悠悠的，能坐着绝不站着", dim:"still"}]},
  {q:"刷手机你最容易停在哪类内容？", a:[
    {t:"山野田园、露营星空", dim:"seclusion"},
    {t:"都市职场、明星八卦", dim:"world"}]},
  {q:"玩游戏你更偏爱？", a:[
    {t:"打斗闯关、竞技对抗", dim:"move"},
    {t:"解谜养成、剧情故事", dim:"still"}]},
  {q:"朋友临时组局，你的第一反应是？", a:[
    {t:"人多太吵，找个借口溜了", dim:"seclusion"},
    {t:"来都来了，赶紧收拾出门", dim:"world"}]},
  {q:"学一个新东西，你倾向？", a:[
    {t:"直接上手，边做边学", dim:"move"},
    {t:"先看攻略，搞懂再动", dim:"still"}]},
  {q:"理想的晚年生活是？", a:[
    {t:"找个小院种菜养花，远离人群", dim:"seclusion"},
    {t:"住在热闹市区，朋友常聚", dim:"world"}]},
  {q:"遇到不公平的事，你会？", a:[
    {t:"当场就想理论，忍不住出手", dim:"move"},
    {t:"先冷静观察，想清楚再处理", dim:"still"}]}
];

var RESULTS = {
  yinshi:{name:"山林隐士", desc:"上辈子你是躲进深山的清修隐士，不争不抢，一壶茶、一张琴，就能安然过一生。"},
  xiake:{name:"江湖侠客", desc:"上辈子你是仗剑走天涯的江湖侠客，路见不平拔刀相助，活得潇洒又痛快。"},
  wenren:{name:"书香文人", desc:"上辈子你是笔墨不离手的才子佳人，一肚子文章，温柔斯文，心里却有主见。"},
  fugui:{name:"王侯富贵", desc:"上辈子你是身居高位的富贵人物，呼朋唤友、锦衣玉食，一辈子风风光光。"}
};

var state = {index:0, score:{seclusion:0,world:0,move:0,still:0}};

function showView(id){
  var views = document.querySelectorAll(".view");
  for(var i=0;i<views.length;i++){views[i].classList.remove("active");}
  document.getElementById(id).classList.add("active");
}

function startQuiz(){
  state = {index:0, score:{seclusion:0,world:0,move:0,still:0}};
  showView("view-quiz");
  renderQuestion();
}

function renderQuestion(){
  var item = QUESTIONS[state.index];
  document.getElementById("step-text").textContent = "第 " + (state.index+1) + " / " + QUESTIONS.length + " 题";
  document.getElementById("progress-fill").style.width = (state.index/QUESTIONS.length*100) + "%";
  document.getElementById("question-text").textContent = item.q;
  var box = document.getElementById("options-box");
  box.innerHTML = "";
  item.a.forEach(function(opt, i){
    var b = document.createElement("button");
    b.className = "opt";
    b.innerHTML = '<span class="tag">' + (i===0?"A":"B") + '</span>' + opt.t;
    b.onclick = function(){ choose(opt.dim); };
    box.appendChild(b);
  });
}

function choose(dim){
  state.score[dim]++;
  state.index++;
  if(state.index < QUESTIONS.length){
    renderQuestion();
  }else{
    showResult();
  }
}

function calcResult(){
  var s = state.score;
  var outWorld = s.seclusion >= s.world;   // 平局默认出世
  var outMove  = s.move >= s.still;        // 平局默认动
  if(outWorld && !outMove){return "yinshi";}
  if(outWorld && outMove){return "xiake";}
  if(!outWorld && !outMove){return "wenren";}
  return "fugui";
}

function showResult(){
  var key = calcResult();
  var r = RESULTS[key];
  document.getElementById("result-name").textContent = r.name;
  document.getElementById("result-desc").textContent = r.desc;
  ["yinshi","xiake","wenren","fugui"].forEach(function(k){
    document.getElementById("img-"+k).classList.toggle("show", k===key);
    document.getElementById("share-"+k).classList.toggle("show", k===key);
  });
  showView("view-result");
}

function restart(){
  startQuiz();
}
</script>
</body>
</html>
